name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [windows]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ── Frontend build ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static frontend
        working-directory: frontend
        run: npm run build

      - name: Verify frontend output
        run: |
          if (!(Test-Path "frontend/out/index.html")) {
            Write-Error "frontend/out/index.html not found"
            exit 1
          }
          Write-Host "Frontend built successfully"
          Get-ChildItem frontend/out -Name | Select-Object -First 15

      # ── Backend build ──
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run PyInstaller
        run: pyinstaller sosm.spec --noconfirm

      - name: Verify build output
        run: |
          if (!(Test-Path "dist/SOSM/SOSM.exe")) {
            Write-Error "SOSM.exe not found"
            exit 1
          }
          $size = (Get-Item "dist/SOSM/SOSM.exe").Length / 1MB
          Write-Host "SOSM.exe size: $([math]::Round($size, 1)) MB"

      # ── Upload artifact ──
      - name: Upload SOSM artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOSM-Windows-x64
          path: dist/SOSM/
          retention-days: 30
