services:
  db:
    image: postgres:15-alpine
    container_name: sosm_db
    environment:
      POSTGRES_USER: sosm_user
      POSTGRES_PASSWORD: sosm_password
      POSTGRES_DB: sosm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sosm_user -d sosm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sosm_redis
    ports:
      - "6379:6379"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sosm_frontend
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8010/api
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
