services:
  db:
    image: postgres:15-alpine
    container_name: sosm_db
    environment:
      POSTGRES_USER: sosm_user
      POSTGRES_PASSWORD: sosm_password
      POSTGRES_DB: sosm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sosm_user -d sosm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sosm_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sosm_api
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Worker runs on the HOST (not in Docker) because Donut Browser (desktop app)
  # manages browser profiles natively with GPU access (authentic WebGL rendering).
  # Start the worker manually on the host:
  #   cd backend && source venv/bin/activate
  #   celery -A app.worker.celery_app worker --loglevel=info --concurrency=10
  #
  # Required environment variables (in .env or exported):
  #   POSTGRES_HOST=localhost
  #   REDIS_HOST=localhost
  #   DONUT_API_URL=http://127.0.0.1:10108
  #   DONUT_API_TOKEN=<token-from-donut-browser-settings>

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sosm_beat
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.worker.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sosm_frontend
    ports:
      - "3010:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    restart: always

volumes:
  postgres_data:
